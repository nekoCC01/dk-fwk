<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>


    <script type="module">
        import { createApp, defineComponent, h, hString } from '../packages/runtime/dist/fe-fwk.js'

        const Counter = defineComponent({
            state: () => ({ count: 0 }),

            add(amount) {
                this.updateState({ count: this.state.count + amount })
            },

            render() {
                return h(
                    'button',
                    { on: { click: () => this.add(1) } },
                    [hString(this.state.count)]
                )
            },
        })

        createApp(Counter).mount(document.body)
    </script>

</body>

</html>
